name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard-nextjs/package-lock.json
      - name: Sheets template tests (Apps Script logic in Node)
        run: node --test sheets-template/tests/metrics.test.cjs
      - name: Install dashboard
        working-directory: dashboard-nextjs
        run: npm ci
      - name: Dashboard tests
        working-directory: dashboard-nextjs
        run: npm test
      - name: Dashboard build (demo mode)
        working-directory: dashboard-nextjs
        env:
          DEMO_MODE: 'true'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
